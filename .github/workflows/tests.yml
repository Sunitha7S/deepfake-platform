# B24 (N5), docs/B24_N5_DESIGN.md §3.2.
#
# First ran on GitHub Actions on 2026-10-23 (run 39995049300, 64 suites, 1486
# tests). Actions are pinned to full commit SHAs, with the release tag in a
# comment, because a tag can be moved; the interpreter is the 3.12 pinned by
# .python-version.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows, not Linux, on purpose. The shipped model_version literal
    # (backend/config.py STUB_ENGINE_VERSION) ends in a decode-environment
    # digest, .d.c9d4025c, that includes platform.system() and the OpenCV
    # wheel's bundled FFmpeg and image-codec versions. It was generated on
    # Windows/AMD64 with opencv-python==4.8.1.78, and it is pinned in
    # backend/config.py and eight test files. On a Linux runner the engines
    # report a different digest and those tests fail, as designed: a decode
    # environment change must not share a result cache. Running CI on Linux
    # needs a deliberate decision about a per-platform literal, not a relaxed
    # check. windows-latest checks files out as CRLF (core.autocrlf=true);
    # the suite was verified locally against a fresh clone checked out the
    # same way.
    runs-on: windows-latest
    steps:
      # Both run on Node 24; v4 and v3 ran on the deprecated Node 20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"

      # --locked fails the job on any drift between pyproject.toml and
      # uv.lock instead of silently rewriting the lock (PA6,
      # docs/B24_N5_DESIGN.md §6.2).
      #
      # --extra onnx added in the SCRFD Integration Program, Phase 2:
      # tests/test_scrfd_detector.py is the first suite in this repository's
      # history to actually construct an onnxruntime.InferenceSession rather
      # than only statically scanning for the import (import_audit.py's
      # MATRIX, which test_the_optional_imports_are_genuinely_lazy already
      # exercised without onnxruntime ever needing to be installed). Without
      # this flag the `onnx` extra's `onnxruntime` package is absent and
      # every SCRFD-detector test fails with ModuleNotFoundError — found by
      # actually running `uv sync --locked --extra dev` +
      # `uv run python tests/run_all.py` in sequence, not assumed.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra onnx

      - name: Run test suite
        run: uv run python tests/run_all.py
